name: Checks

on:
  # The merge queue checks the merge of each pull request with main before merging it.
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The commands check-<name> of the flake.
        check:
          - actionlint
          - commits
          - editorconfig
          - flake
          - markdownlint
          - names
          - nixfmt
          - reuse
          - shellcheck
          - shfmt
          - site
          - taplo
          - typos
          - yamllint
    # ubuntu-26.04 waits until actionlint knows it (#27).
    runs-on: ubuntu-24.04
    steps:
      # The merge of the pull request with main, or the merge of the merge queue, without its
      # history, so that the matrix and the flake come from the same commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # 31.11.3
      - if: matrix.check != 'commits'
        name: Run the check
        run: nix run --quiet ".#check-$CHECK"
        env:
          CHECK: ${{ matrix.check }}
      # The commits of a pull request only, after its base, with the history of both; main and the
      # merge queue get them through a merge commit.
      - if: matrix.check == 'commits' && github.event_name == 'pull_request'
        name: Run the check
        run: |
          git fetch --quiet --unshallow origin "$HEAD" "$BASE"
          nix run --quiet .#check-commits -- "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # The only check that the ruleset of main requires, which passes when every job of the matrix
  # passed, so that a new check is only added to the matrix: it runs even when one of them fails,
  # since a skipped job would count as passed.
  checks:
    needs: check
    if: always()
    # ubuntu-26.04 waits until actionlint knows it (#27).
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.check.result }}
