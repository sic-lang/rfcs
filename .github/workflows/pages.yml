name: Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

# One deployment at a time, so that an older one never replaces a newer one, and the one in
# progress is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-26.04 waits until actionlint knows it (#27).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # 31.11.3
      - name: Build the site
        run: nix run --quiet .#build-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: book
  deploy:
    needs: build
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
