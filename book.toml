# The RFC book: nix run .#build-site writes its src/ and builds it into book/, which GitHub Pages
# serves.
[book]
title = "The Sic RFC Book"

[output.html]
# Centers the diagrams, which mdBook aligns to the left like any pre block.
additional-css = ["mermaid.css"]
# The files of mdbook-mermaid, which build-site writes where its install command does, with the
# Mermaid of the flake.
additional-js = ["mermaid.min.js", "mermaid-init.js"]
git-repository-url = "https://github.com/sic-lang/rfcs"
# The RFCs are numbered by their file names, which the chapter numbers of mdBook would contradict.
no-section-label = true
# GitHub Pages serves the book under /rfcs/, and its 404 page at any missing path, from which the
# files of the page are only found through this URL.
site-url = "/rfcs/"

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Renders the mathematics in the syntax of GitHub, in which the RFCs are written, so that they read
# the same on GitHub and in the book.
[preprocessor.katex]
after = ["links"]
block-delimiter = { left = "```math\n", right = "\n```" }
inline-delimiter = { left = "$`", right = "`$" }
